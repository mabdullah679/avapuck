apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-init
  namespace: trips
data:
  10-warehouse.sql: |
    -- Warehouse schema, applied at first container start.
    --
    -- Idempotency lives HERE, in the primary key, not in the loader
    -- remembering to delete first -- which is the version that eventually
    -- forgets. Re-running a slice upserts on trip_id.
    CREATE SCHEMA IF NOT EXISTS warehouse;

    CREATE TABLE IF NOT EXISTS warehouse.trips (
        trip_id                   TEXT PRIMARY KEY,
        logical_date              DATE NOT NULL,
        bike_id_masked            TEXT,
        subscriber_type_masked    TEXT,
        start_station_masked      TEXT,
        end_station_masked        TEXT,
        bike_id_blind_index       TEXT,
        start_station_blind_index TEXT,
        start_time                TIMESTAMPTZ NOT NULL,
        duration_minutes          INTEGER NOT NULL CHECK (duration_minutes > 0),
        masked_by                 TEXT NOT NULL,
        loaded_at                 TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_trips_logical_date ON warehouse.trips (logical_date);
    CREATE INDEX IF NOT EXISTS idx_trips_start_time   ON warehouse.trips (start_time);
    CREATE INDEX IF NOT EXISTS idx_trips_bike_id_bi   ON warehouse.trips (bike_id_blind_index);

    CREATE TABLE IF NOT EXISTS warehouse.load_audit (
        run_id           TEXT PRIMARY KEY,
        logical_date     DATE NOT NULL,
        rows_extracted   INTEGER NOT NULL,
        rows_loaded      INTEGER NOT NULL,
        rows_updated     INTEGER NOT NULL,
        bytes_billed     BIGINT,
        extract_mode     TEXT NOT NULL,
        masked_by        TEXT NOT NULL,
        started_at       TIMESTAMPTZ NOT NULL,
        finished_at      TIMESTAMPTZ NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_audit_logical_date ON warehouse.load_audit (logical_date);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: trips
  labels: {app: postgres, tier: warehouse}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, tier: warehouse}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432, name: pg}]
          env:
            - {name: POSTGRES_DB, value: analytics}
            - {name: POSTGRES_USER, value: pipeline}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pipeline-datastores, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits:   {cpu: 1, memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "pipeline", "-d", "analytics"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "pipeline", "-d", "analytics"]}
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: init
          configMap: {name: warehouse-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trips
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432, name: pg}]

# SERVICE B BINDING — MySQL team, deeply nested attribute-heavy XML
schema: wps.binding/v1
service_id: service_b
service_name: Merchant Platform Quarterly Export
binds_contract: quarterly_performance
binds_contract_version: "1.0.0"
dictionary_version: "1.0.0"

# The service's own REPORTING CALENDAR, which governs how its fiscal
# quarter labels resolve. Money precision comes from each contract's
# settlement currency, not from this.
reporting_calendar_jurisdiction: UK
auth_profile: auth/profiles.yaml#/profiles/service_b_mtls

source:
  format: xml
  encoding: utf-8
  # DECLARED PRECISION CEILING. The merchant platform stores money as
  # DECIMAL(18,2) and its exporter serialises two decimal places. Like Service
  # A, it cannot represent a BHD amount at full precision -- the third decimal
  # is lost at the source. Declared so affected rows are marked rather than
  # silently rounded, and so a better source is preferred where one exists.
  max_decimal_places: 2
  root_path: /QuarterlyExport
  # The entity record is the Merchant; the FACT record is each Reporting block
  # beneath it. Agreement context is inherited by matching @agreement to @ref.
  # All three paths are declared here rather than assumed by the parser.
  entity_record_path: Merchants/Merchant
  fact_record_path: mp:Reporting
  child_paths:
    agreement: mp:Agreements/mp:Agreement
    agreement_key_attr: ref
    fact_parent_attr: agreement
  namespaces:
    mp: "urn:mysql-team:merchant-platform:v3"

# Service B says "nothing" by omitting the element entirely, OR by sending an
# empty element, OR by xsi:nil. Three ways to say the same thing, all real.
null_convention:
  tokens: ["", "N/A", "null"]
  absent_element_is_null: true
  xsi_nil_is_null: true
  zero_is_null: false

layout:
  merchant_ref:      { xpath: "@mp:ref" }
  legal_name:        { xpath: "mp:Identity/mp:LegalName/text()" }
  contact_email:     { xpath: "mp:Identity/mp:Contact[@primary='true']/mp:Email/text()" }
  onboard_date:      { xpath: "mp:Identity/@onboarded" }
  status_attr:       { xpath: "@status" }
  contract_ref:      { xpath: "mp:Agreements/mp:Agreement/@ref" }
  contract_tier:     { xpath: "mp:Agreements/mp:Agreement/@tier" }
  contract_from:     { xpath: "mp:Agreements/mp:Agreement/mp:Term/@from" }
  contract_to:       { xpath: "mp:Agreements/mp:Agreement/mp:Term/@to" }
  currency_code:     { xpath: "mp:Agreements/mp:Agreement/@ccy" }
  fiscal_period:     { xpath: "mp:Reporting/@period", note: "e.g. FY26Q3 — UK fiscal, Oct-Dec 2026" }
  # Repeating group: monthly buckets that must be summed to a quarterly figure.
  monthly_gross:     { xpath: "mp:Reporting/mp:Month/mp:GrossNetOfRefunds/text()", repeating: true }
  monthly_txn:       { xpath: "mp:Reporting/mp:Month/mp:SettledCount/text()", repeating: true }
  monthly_refunds:   { xpath: "mp:Reporting/mp:Month/mp:RefundCount/text()", repeating: true }
  monthly_chargebacks: { xpath: "mp:Reporting/mp:Month/mp:ChargebackCount/text()", repeating: true }
  refund_value:      { xpath: "mp:Reporting/mp:RefundValue/text()" }
  net_revenue:       { xpath: "mp:Reporting/mp:NetRevenue/text()" }
  active_30d:        { xpath: "mp:Reporting/mp:ActiveAccounts[@basis='txn30d']/text()" }

classification_declarations:
  legal_name:    pii
  contact_email: pii

mappings:

  merchant.merchant_id:
    from: merchant_ref
    ops: [ { trim: {} }, { lookup: { table: lookups/merchant_xref.yaml#/service_b, on_missing: fail } } ]

  merchant.legal_name:
    from: legal_name
    ops: [ { trim: {} }, { tokenize: { scheme: classification/policy.yaml#/classifications/pii } } ]

  merchant.primary_contact_email:
    from: contact_email
    ops: [ { trim: {} }, { tokenize: { scheme: classification/policy.yaml#/classifications/pii } } ]

  merchant.onboarded_on:
    from: onboard_date
    ops: [ { date_parse: { format: "%Y-%m-%d" } } ]

  merchant.status:
    from: status_attr
    ops: [ { lookup: { table: lookups/status_map.yaml#/service_b, on_missing: fail } } ]

  contract.contract_id:
    from: contract_ref
    ops: [ { trim: {} } ]

  contract.settlement_currency:
    from: currency_code
    ops: [ { trim: {} } ]

  contract.pricing_tier:
    from: contract_tier
    ops: [ { lookup: { table: lookups/status_map.yaml#/tier_service_b, on_missing: fail } } ]

  contract.effective_from:
    from: contract_from
    ops: [ { date_parse: { format: "%Y-%m-%d" } } ]

  contract.effective_to:
    from: contract_to
    ops: [ { coalesce_null_convention: { tokens: ["", "9999-12-31"], zero_is_null: false } },
           { date_parse: { format: "%Y-%m-%d" } } ]

  # THE PERIOD CONFLICT, other side. Same literal "FY26Q3" as Service A, but
  # UK fiscal starts in April, so this is Oct-Dec 2026 while Service A's is
  # Jul-Sep 2026. Nothing in the string reveals this. Only the jurisdiction does.
  period.period_id:
    from: fiscal_period
    ops: [ { fiscal_to_calendar_quarter: { jurisdiction: "$.reporting_calendar_jurisdiction", label_format: "FY%yQ%q" } },
           { period_id: {} } ]

  quarterly_performance.active_accounts:
    from: active_30d
    applies_rule: rules.yaml#/active_account/incl_30d_txn
    ops: [ { coalesce_null_convention: { tokens: ["N/A"], zero_is_null: false } }, { cast: { to: int } } ]
    canonical_recomputable: false
    canonical_gap_reason: >
      Service B reports a 30-day-transacting count only. canon_v1 needs a
      90-day window and the underlying account detail is not exported, so the
      canonical variant is not derivable from this source. Recorded rather
      than approximated.

  # Repeating group summed to quarter, AND a rule divergence: Service B has
  # already netted refunds out of what it calls "gross".
  quarterly_performance.gross_volume_minor:
    from: monthly_gross
    applies_rule: rules.yaml#/gross_volume/net_of_refunds
    ops: [ { sum_repeating_group: { path: "mp:Reporting/mp:Month", of: "mp:GrossNetOfRefunds" } },
           { to_minor_units: { currency_from: "contract.settlement_currency" } } ]
    canonical_recomputable: true
    canonical_recompute:
      description: "Add the separately reported refund value back to reach canon_v1 gross."
      from: [refund_value]
      ops: [ { to_minor_units: { currency_from: "contract.settlement_currency" } } ]
      combine: add

  quarterly_performance.net_revenue_minor:
    from: net_revenue
    applies_rule: rules.yaml#/net_revenue/canon_v1
    ops: [ { to_minor_units: { currency_from: "contract.settlement_currency" } } ]
    canonical_recomputable: true

  quarterly_performance.settled_txn_count:
    from: monthly_txn
    ops: [ { sum_repeating_group: { path: "mp:Reporting/mp:Month", of: "mp:SettledCount" } }, { cast: { to: bigint } } ]

  quarterly_performance.refund_count:
    from: monthly_refunds
    ops: [ { sum_repeating_group: { path: "mp:Reporting/mp:Month", of: "mp:RefundCount" } }, { cast: { to: bigint } } ]

  quarterly_performance.chargeback_count:
    from: monthly_chargebacks
    ops: [ { sum_repeating_group: { path: "mp:Reporting/mp:Month", of: "mp:ChargebackCount" } }, { cast: { to: bigint } } ]

quality:
  - { id: xml_wellformed,  rule: "Document parses and validates against the declared namespace.", on_fail: fail_batch }
  - { id: months_per_quarter, rule: "Each Reporting element contains exactly 3 Month children.", on_fail: quarantine_row }

# SERVICE C BINDING — PII team, analyst-authored CSV with a multi-row header
#
# The most human of the four formats, and therefore the most treacherous:
# a title row, a metadata row, a units row, then column names, then data.
# Conventions a person absorbs at a glance and a parser must be told.
schema: wps.binding/v1
service_id: service_c
service_name: Risk & Identity Quarterly Workbook Export
binds_contract: quarterly_performance
binds_contract_version: "1.0.0"
dictionary_version: "1.0.0"

# The service's own REPORTING CALENDAR, which governs how its fiscal
# quarter labels resolve. Money precision comes from each contract's
# settlement currency, not from this.
reporting_calendar_jurisdiction: JP
auth_profile: auth/profiles.yaml#/profiles/service_c_hmac

source:
  format: csv_multiheader
  encoding: utf-8-sig      # analyst's spreadsheet leaves a BOM
  delimiter: ","
  quote: '"'
  header_block:
    rows: 4
    row_roles:
      1: title              # "Risk & Identity — Quarterly Performance"
      2: metadata           # key=value pairs: period, prepared_by, basis
      3: units              # per-column unit annotations, e.g. "JPY (whole yen)"
      4: column_names
    metadata_row_parse: { style: key_value, pair_sep: ";", kv_sep: "=" }
  data_starts_row: 5
  trailing_notes_rows: true    # analysts leave commentary at the bottom
  trailing_notes_detector: { first_cell_matches: "^(Note|Notes|Prepared|\\*)" }

# The analyst's null vocabulary. "-" and "n/a" mean absent; "0" means zero.
# But this team also uses "0" for suppressed small counts, which is a genuine
# ambiguity we surface rather than silently resolve.
null_convention:
  tokens: ["", "-", "n/a", "N/A", "#N/A", "TBC"]
  zero_is_null: false
  ambiguity_note: >
    This team also writes 0 for values suppressed under a small-count
    disclosure rule. The extract does not distinguish suppressed-zero from
    true-zero. Flagged in TRUST-BOUNDARY.md rather than guessed at.

layout:
  merchant_code:    { column: "Merchant Code" }
  merchant_name:    { column: "Merchant (legal)" }
  agreement_no:     { column: "Agreement No." }
  tier:             { column: "Tier" }
  kyc_state:        { column: "KYC" }
  period_label:     { column: "Quarter", note: "e.g. FY26Q3 — JP fiscal (Apr-Mar), so Oct-Dec 2026" }
  currency_code:    { column: "Ccy" }
  active_verified:  { column: "Active accts (verified only)" }
  gross_net:        { column: "Gross (net of refunds & fees)" }
  fees:             { column: "Platform fees" }
  refund_value:     { column: "Refund value" }
  net_rev:          { column: "Net revenue" }
  txn_count:        { column: "Settled txns" }
  refund_count:     { column: "Refunds" }
  chargeback_count: { column: "Chargebacks" }
  tax_id:           { column: "Tax ID" }

classification_declarations:
  merchant_name: pii
  tax_id:        pii
  kyc_state:     pii

mappings:

  merchant.merchant_id:
    from: merchant_code
    ops: [ { trim: {} }, { lookup: { table: lookups/merchant_xref.yaml#/service_c, on_missing: fail } } ]

  merchant.legal_name:
    from: merchant_name
    ops: [ { trim: {} }, { tokenize: { scheme: classification/policy.yaml#/classifications/pii } } ]

  merchant.tax_ref:
    from: tax_id
    ops: [ { trim: {} }, { tokenize: { scheme: classification/policy.yaml#/classifications/pii } } ]

  contract.contract_id:
    from: agreement_no
    ops: [ { trim: {} } ]

  contract.settlement_currency:
    from: currency_code
    ops: [ { trim: {} } ]

  contract.pricing_tier:
    from: tier
    ops: [ { lookup: { table: lookups/status_map.yaml#/tier_service_c, on_missing: fail } } ]

  period.period_id:
    from: period_label
    ops: [ { fiscal_to_calendar_quarter: { jurisdiction: "$.reporting_calendar_jurisdiction", label_format: "FY%yQ%q" } },
           { period_id: {} } ]

  quarterly_performance.active_accounts:
    from: active_verified
    applies_rule: rules.yaml#/active_account/incl_verified_only
    ops: [ { coalesce_null_convention: { tokens: ["-", "n/a", "TBC"], zero_is_null: false } },
           { cast: { to: int } } ]
    canonical_recomputable: false
    canonical_gap_reason: >
      Excludes pending-KYC accounts and does not report how many were
      excluded, so canon_v1 cannot be reconstructed. Undercount direction is
      known; magnitude is not. Stated, not estimated.

  # THE PRECISION TRAP, live. JPY has ZERO minor units. A pipeline that
  # assumed the near-universal 2 would inflate every Japanese figure 100x and
  # put a fabricated order of magnitude in front of an investment committee.
  # to_minor_units reads the currency's declared precision instead of assuming.
  quarterly_performance.gross_volume_minor:
    from: gross_net
    applies_rule: rules.yaml#/gross_volume/net_of_refunds_and_fees
    ops: [ { coalesce_null_convention: { tokens: ["-", "n/a"], zero_is_null: false } },
           { to_minor_units: { currency_from: "contract.settlement_currency" } } ]
    canonical_recomputable: true
    canonical_recompute:
      description: "Add refund value and platform fees back to reach canon_v1 gross."
      from: [refund_value, fees]
      ops: [ { to_minor_units: { currency_from: "contract.settlement_currency" } } ]
      combine: add

  quarterly_performance.net_revenue_minor:
    from: net_rev
    applies_rule: rules.yaml#/net_revenue/canon_v1
    ops: [ { coalesce_null_convention: { tokens: ["-", "n/a"], zero_is_null: false } },
           { to_minor_units: { currency_from: "contract.settlement_currency" } } ]

  quarterly_performance.settled_txn_count:
    from: txn_count
    ops: [ { coalesce_null_convention: { tokens: ["-", "n/a"], zero_is_null: false } }, { cast: { to: bigint } } ]

  quarterly_performance.refund_count:
    from: refund_count
    ops: [ { coalesce_null_convention: { tokens: ["-", "n/a"], zero_is_null: false } }, { cast: { to: bigint } } ]

  quarterly_performance.chargeback_count:
    from: chargeback_count
    ops: [ { coalesce_null_convention: { tokens: ["-", "n/a"], zero_is_null: false } }, { cast: { to: bigint } } ]

quality:
  - { id: header_block_shape, rule: "Rows 1-4 match the declared roles; column names row is present.", on_fail: fail_batch }
  - { id: currency_declared,  rule: "Every data row declares a settlement currency that resolves in jurisdictions.yaml.", on_fail: fail_batch }
  - { id: no_trailing_notes_as_data, rule: "Trailing commentary rows are detected and excluded, not parsed as records.", on_fail: fail_batch }

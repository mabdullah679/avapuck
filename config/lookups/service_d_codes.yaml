# SERVICE D CODE TABLES
# Service D is terse to the point of hostility. Every meaningful value is a
# 2-3 character code resolved through these tables. This is precisely the kind
# of knowledge that lives in one analyst's head until it lives in config.
schema: wps.lookup.codes/v1

status:
  PR: prospective
  AC: active
  SU: suspended
  TM: terminated

pricing_tier:
  T1: standard
  T2: preferred
  T3: strategic
  TX: bespoke

jurisdiction:
  "01": US
  "44": UK
  "81": JP
  "973": BH

currency:
  "840": USD
  "826": GBP
  "392": JPY
  "048": BHD

metric_code:
  AA: active_accounts
  GV: gross_volume_minor
  NR: net_revenue_minor
  TC: settled_txn_count
  RC: refund_count
  CB: chargeback_count

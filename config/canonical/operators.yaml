# THE CLOSED TRANSFORM VOCABULARY
#
# This file is the honest boundary of the "mappings live in config, not code"
# claim, and it is stated openly in TRUST-BOUNDARY.md §5.1.
#
# Bindings (config/bindings/*.yaml) may ONLY compose operators declared here.
# There is no arbitrary expression language, no eval, no inline Python. A
# service that needs a transform this vocabulary cannot express does not get a
# special case in pipeline code — it gets a NEW NAMED OPERATOR added here,
# implemented in wps/operators/, tested, and reviewed. That is a governed,
# visible change rather than a hidden one.
#
# Why closed rather than open: an open expression language is code wearing a
# config costume. The business cannot audit a lambda. It can audit a list of
# named, documented rules.
schema: wps.canonical.operators/v1
dictionary_version: "1.0.0"

operators:

  # --- structural -------------------------------------------------------
  copy:
    summary: Take the source value unchanged.
    args: {}
  literal:
    summary: Emit a constant declared in the binding.
    args: { value: any }
  cast:
    summary: Coerce to a canonical type, failing loudly on impossible casts.
    args: { to: enum[int,bigint,decimal,string,bool,date] }
  concat:
    summary: Join several source values with a separator.
    args: { sep: string }
  trim:
    summary: Strip surrounding whitespace and COBOL filler characters.
    args: { chars: string? }
  sum_repeating_group:
    summary: >
      Sum a repeated child element/segment into one canonical scalar.
      Needed for Service B's nested XML and Service A's OCCURS clauses.
    args: { path: string, of: string }

  # --- numeric / money --------------------------------------------------
  implied_decimal:
    summary: >
      Interpret a packed/unscaled integer as having N implied decimal places.
      COBOL PIC S9(11)V99 arrives as "000000123456" meaning 1234.56.
    args: { places: int }
  scale:
    summary: Multiply by a declared constant factor.
    args: { factor: decimal }
  to_minor_units:
    summary: >
      Convert a major-unit amount to integer minor units using the currency's
      declared precision from jurisdictions.yaml. JPY has 0 minor units and
      BHD has 3 — this is the operator that prevents the 100x/10x silent
      corruption.
    args: { currency_from: field_ref }
  fx_convert:
    summary: >
      Convert minor units between currencies using a declared, dated rate
      table. Never used to REPLACE the native figure, only to add a
      reporting-currency companion.
    args: { to: currency_code, rate_table: ref, as_of: field_ref }
  round_half_even:
    summary: Banker's rounding to a declared precision.
    args: { places: int }

  # --- time -------------------------------------------------------------
  date_parse:
    summary: Parse a native date string into a canonical date.
    args: { format: string }
  fiscal_to_calendar_quarter:
    summary: >
      Translate a service's fiscal quarter label into the canonical period,
      using its jurisdiction's fiscal_year_start_month. UK/JP FY26Q1 is
      Apr-Jun 2026; US/BH FY26Q1 is Jan-Mar 2026. Same label, different
      three months. This is the seeded period conflict.
    args: { jurisdiction: field_ref, label_format: string }
  period_id:
    summary: Emit the canonical period identifier from a calendar quarter.
    args: {}

  # --- nulls and codes --------------------------------------------------
  coalesce_null_convention:
    summary: >
      Map a service's OWN null tokens to canonical NULL. Each team invented
      its own: spaces, "N/A", "-1", "0000-00-00", empty tag, "\\N". Critically,
      this distinguishes "absent" from "genuinely zero" — conflating them
      misstates revenue.
    args: { tokens: list[string], zero_is_null: bool }
  lookup:
    summary: >
      Resolve a terse source code through a declared lookup table.
      Service D is entirely lookup-dependent.
    args: { table: ref, on_missing: enum[null,fail,passthrough] }

  # --- governance-sensitive --------------------------------------------
  decrypt_ref:
    summary: >
      Route an opaque encrypted blob through the named DecryptionProvider
      interface. STUBBED — see TRUST-BOUNDARY.md §2.1. The pipeline knows the
      field is encrypted, which key alias governs it, and what it becomes
      after decryption, WITHOUT this repo holding any key material.
    args: { key_alias: string, plaintext_type: string }
  tokenize:
    summary: >
      Replace a PCI/PII value with a deterministic token before it may cross
      into Silver. Stubbed local hashing, not a vault.
    args: { scheme: ref }
  mask:
    summary: Redact all but a declared number of trailing characters.
    args: { keep_last: int }

  # --- semantics --------------------------------------------------------
  inclusion_predicate:
    summary: >
      Apply a NAMED, DECLARED business rule to decide which underlying
      records count toward a contested metric. This is how "active account"
      stops being a hardcoded WHERE clause and becomes an auditable,
      per-service business definition that the dashboard can cite by name.
    args: { rule: ref }

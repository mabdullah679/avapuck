# NAMED BUSINESS RULES
#
# Every contested metric resolves through a rule declared HERE and referenced
# by name from the dictionary and the bindings. A rule is never an anonymous
# WHERE clause inside a transform — it is a named, described, citable object,
# so that a dashboard can say "812, per rule incl_30d_txn" and a reader can
# look up exactly what that means and who owns it.
schema: wps.canonical.rules/v1
dictionary_version: "1.0.0"

active_account:

  canon_v1:
    owner: platform_ssot
    description: >
      Open at any point in the period AND at least one settled transaction
      within the trailing 90 days of period end.
    predicate:
      all_of:
        - { field: account_open_in_period, op: is_true }
        - { field: days_since_last_settled_txn, op: lte, value: 90 }
    rationale: >
      Chosen as canon because it is the intersection of what all four teams
      are directionally trying to measure — an account that both exists and
      is doing something — without adopting any one team's local threshold.

  incl_any_open:
    owner: service_a_ocio
    description: "Any account not closed as of period end, regardless of activity."
    predicate:
      all_of:
        - { field: account_closed_on, op: is_null_or_after, value: period_end }
    known_divergence: "Overcounts relative to canon by including dormant accounts."

  incl_30d_txn:
    owner: service_b_mysql
    description: "At least one settled transaction in the trailing 30 days of period end."
    predicate:
      all_of:
        - { field: days_since_last_settled_txn, op: lte, value: 30 }
    known_divergence: "Undercounts relative to canon; a 31-90 day account is active by canon but not by this rule."

  incl_verified_only:
    owner: service_c_pii
    description: "Open and transacting, but excluding accounts pending identity verification."
    predicate:
      all_of:
        - { field: account_open_in_period, op: is_true }
        - { field: days_since_last_settled_txn, op: lte, value: 90 }
        - { field: kyc_state, op: eq, value: verified }
    known_divergence: "Undercounts relative to canon by excluding pending-KYC accounts."

  incl_nonzero_balance:
    owner: service_d_legacy
    description: "Non-zero closing balance at period end."
    predicate:
      all_of:
        - { field: closing_balance_minor, op: neq, value: 0 }
    known_divergence: >
      Measures a different thing entirely — balance, not activity. Retained
      because the legacy mainframe genuinely reports this and the team calls
      it 'active'. The dictionary's job is to make that visible, not to
      pretend it agrees.

gross_volume:
  canon_v1:
    owner: platform_ssot
    description: "Settled transaction value before ANY deduction, in integer minor units of the settlement currency."
    includes: [settled]
    excludes: [refunds_netting, fee_netting, chargeback_netting]
  net_of_refunds:
    owner: service_b_mysql
    description: "Settled value with refunds already netted out."
    known_divergence: "Understates canonical gross by the refund total."
  net_of_refunds_and_fees:
    owner: service_c_pii
    description: "Settled value net of both refunds and platform fees."
    known_divergence: "Understates canonical gross by refunds plus fees."

net_revenue:
  canon_v1:
    owner: platform_ssot
    description: "Gross volume less refunds, chargebacks, and contracted fees."
    deductions: [refunds, chargebacks, contracted_fees]
  gross_of_platform_fees:
    owner: service_a_ocio
    description: "Revenue reported before platform fees are deducted."
    known_divergence: "Overstates canonical net by the platform fee total."

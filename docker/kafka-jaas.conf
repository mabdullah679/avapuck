// Broker-side JAAS for the KRaft node.
//
// SCRAM credentials for the pipeline users are stored in Kafka's own metadata
// (created by kafka-init.sh), not here. What this file provides is:
//   * the inter-broker/controller identity the node uses to talk to itself
//   * the admin user, which is also the only user with cluster-wide rights
//
// Passwords here are DEV DEFAULTS. Override every one of them via the
// environment before running this anywhere shared -- see docs/SECRETS.md.
KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="admin"
  password="admin-dev-password"
  user_admin="admin-dev-password"
  user_pipeline="pipeline-dev-password"
  user_consumer="consumer-dev-password";
};

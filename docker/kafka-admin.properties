# Admin client config: used by the healthcheck and by kafka-init.sh to create
# topics and grant ACLs. `admin` is a super user, so this file is the one set
# of credentials that can change the cluster's authorization.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-dev-password";

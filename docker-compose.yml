# Local stack for the BigQuery -> Spark -> Kafka -> Hive -> Postgres -> PDF pipeline.
#
# EVERY value comes from .env.local (docs/DECISIONS.md D12). There are no
# built-in defaults here on purpose: `${VAR:?}` fails the whole `up` naming
# the missing variable, and `${VAR?}` allows an empty value but still requires
# the variable to be declared. One file is the contact point for the entire
# stack; copy .env.example to .env.local and edit it.
#
#   docker compose --env-file .env.local --profile core up -d        # the pipeline
#   docker compose --env-file .env.local --profile core --profile ci up -d     # + Jenkins
#   docker compose --env-file .env.local --profile core --profile ranger up -d # + Ranger admin
#
# setup.sh does all of this. Give Docker 8 GB.

x-common: &common
  restart: unless-stopped
  networks: [pipeline]

# Every pipeline client verifies the service certs against this CA. Unset it
# and the clients fall back to the system trust store, which does NOT contain
# the dev CA -- calls then fail closed, by design.
x-tls: &tls
  PIPELINE_CA_BUNDLE: /certs/ca.crt
  IDP_ISSUER: https://idp:8443
  IDP_JWKS_URL: https://idp:8443/.well-known/jwks.json
  IDP_URL: https://idp:8443

x-kafka-client: &kafka-client
  KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:?}
  KAFKA_TOPIC_ENCRYPTED: ${KAFKA_TOPIC_ENCRYPTED:?}
  KAFKA_TOPIC_PUBLIC: ${KAFKA_TOPIC_PUBLIC:?}
  KAFKA_TOPIC_CONTROL: ${KAFKA_TOPIC_CONTROL:?}
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: PLAIN

x-postgres-client: &postgres-client
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

services:

  # ── Identity Provider ────────────────────────────────────────────────────
  idp:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.service}
    container_name: pl-idp
    command: >
      uvicorn services.idp.app:app --host 0.0.0.0 --port 8443
      --ssl-certfile /certs/idp.crt --ssl-keyfile /certs/idp.key
    volumes:
      - ./certs:/certs:ro
      - ./config/traffic_profile.json:/opt/pipeline/config/traffic_profile.json:ro
    environment:
      IDP_ISSUER: https://idp:8443
      IDP_TOKEN_TTL: "300"
      CLIENT_SECRET_EXTRACT_JOB: ${CLIENT_SECRET_EXTRACT_JOB:?}
      CLIENT_SECRET_SPARK_JOB: ${CLIENT_SECRET_SPARK_JOB:?}
      CLIENT_SECRET_HIVE_JOB: ${CLIENT_SECRET_HIVE_JOB:?}
      CLIENT_SECRET_POSTGRES_JOB: ${CLIENT_SECRET_POSTGRES_JOB:?}
      CLIENT_SECRET_REPORT_JOB: ${CLIENT_SECRET_REPORT_JOB:?}
      # May sign run verdicts (POST /sign) and nothing else.
      CLIENT_SECRET_ORCHESTRATOR_JOB: ${CLIENT_SECRET_ORCHESTRATOR_JOB:?}
      # The console's admin login: the console forwards the password as this
      # client's secret and verifies the token it gets back (D20).
      CLIENT_SECRET_CONSOLE_ADMIN: ${CLIENT_SECRET_CONSOLE_ADMIN:?}
      # Empty -> an ephemeral key per start; tokens and verdict signatures
      # then do not survive a restart. Fine locally, fatal anywhere else.
      IDP_SIGNING_KEY: ${IDP_SIGNING_KEY?}
      # Traffic audit (D18): the compose network is allowlisted so the
      # pipeline's own token requests are never blocked; everything else is
      # held to config/traffic_profile.json.
      TRAFFIC_ALLOWLIST: ${TRAFFIC_ALLOWLIST_INTERNAL:?}
      TRAFFIC_BLOCK_SECONDS: ${TRAFFIC_BLOCK_SECONDS:?}
    ports: ["8443:8443"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://localhost:8443/health',context=ssl.create_default_context(cafile='/certs/ca.crt'))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Crypto service (AES-256-GCM) ─────────────────────────────────────────
  crypto:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.service}
    container_name: pl-crypto
    # ONE worker process. With CRYPTO_MASTER_KEY empty each process generates
    # its own random key, so `--workers N` makes decrypt fail for anything
    # another worker encrypted (seen live, 2026-09-08). To scale this service
    # for the 2 GB test, set CRYPTO_MASTER_KEY and BLIND_INDEX_KEY to fixed
    # base64 32-byte values in .env.local FIRST, then add --workers N here.
    command: >
      uvicorn services.crypto.app:app --host 0.0.0.0 --port 8444
      --ssl-certfile /certs/crypto.crt --ssl-keyfile /certs/crypto.key
    volumes: ["./certs:/certs:ro"]
    environment:
      <<: *tls
      # Empty -> a new master key per start and ALL prior ciphertext becomes
      # unreadable. TRUST-BOUNDARY 2.2.
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY?}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY?}
      CRYPTO_KEY_VERSION: v1
    ports: ["8444:8444"]
    mem_limit: 512m
    depends_on:
      idp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://localhost:8444/health',context=ssl.create_default_context(cafile='/certs/ca.crt'))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Kafka (KRaft — no ZooKeeper) ─────────────────────────────────────────
  kafka:
    <<: *common
    profiles: [core]
    image: apache/kafka:3.9.0
    container_name: pl-kafka
    # Renders the JAAS file and admin config from the environment, then runs
    # the image's own start script. No credential file is committed.
    entrypoint: ["/bin/sh", "/kafka-entrypoint.sh"]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
      KAFKA_PIPELINE_PASSWORD: ${KAFKA_PIPELINE_PASSWORD:?}
      KAFKA_CONSUMER_PASSWORD: ${KAFKA_CONSUMER_PASSWORD:?}
      KAFKA_UI_PASSWORD: ${KAFKA_UI_PASSWORD:?}
      KAFKA_WATCHDOG_PASSWORD: ${KAFKA_WATCHDOG_PASSWORD:?}
      KAFKA_TAP_PASSWORD: ${KAFKA_TAP_PASSWORD:?}
      # Single-node KRaft: this broker is also the controller. Fine for a
      # local stack; a real deployment runs 3+ controllers and RF>=3.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # The CONTROLLER listener must NOT appear in advertised.listeners.
      # Client listeners require SASL/PLAIN; the controller listener stays
      # plain because it never leaves this node in a single-node KRaft setup.
      # SASL_PLAINTEXT is AUTHENTICATION, not encryption -- TRUST-BOUNDARY 2.9a.
      KAFKA_LISTENERS: SASL_PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # ANONYMOUS is the controller listener's principal (PLAINTEXT, never
      # leaves this node). Client listeners still require SASL.
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
      # Deny by default: a principal with no matching ACL gets nothing.
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Uncapped uploads publish every row (D16): give the broker room.
      KAFKA_LOG_RETENTION_BYTES: "-1"
      KAFKA_HEAP_OPTS: -Xmx1g -Xms512m
      CLUSTER_ID: pl-kafka-local-cluster
    ports: ["29092:29092"]
    mem_limit: 2g
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./docker/kafka-entrypoint.sh:/kafka-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Creates the topics and ACLs once, then exits.
  kafka-init:
    <<: *common
    profiles: [core]
    image: apache/kafka:3.9.0
    container_name: pl-kafka-init
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      <<: *kafka-client
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
    volumes:
      - ./docker/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/sh", "/kafka-init.sh"]

  # ── Kafka UI (Kafbat), read-only ─────────────────────────────────────────
  kafka-ui:
    <<: *common
    profiles: [core]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: pl-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP:?}
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="ui" password="${KAFKA_UI_PASSWORD:?}";
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_LOGIN_USER:?}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_LOGIN_PASSWORD:?}
      JAVA_OPTS: -Xms128m -Xmx384m
    ports: ["8090:8080"]
    mem_limit: 768m
    depends_on:
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Kafka tap: scrape-only, into monitor.kafka_log ───────────────────────
  tap:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.ops}
    container_name: pl-tap
    command: uvicorn services.tap.app:app --host 0.0.0.0 --port 8449
    environment:
      <<: [*kafka-client, *postgres-client]
      KAFKA_SASL_USERNAME: tap
      KAFKA_SASL_PASSWORD: ${KAFKA_TAP_PASSWORD:?}
    mem_limit: 256m
    depends_on:
      kafka: {condition: service_healthy}
      # Its ACLs come from kafka-init; starting before that meant a
      # "not authorized" first contact and a five-minute metadata wait.
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8449/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Absence watchdog ─────────────────────────────────────────────────────
  watchdog:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.ops}
    container_name: pl-watchdog
    command: uvicorn services.watchdog.app:app --host 0.0.0.0 --port 8446
    environment:
      <<: [*tls, *kafka-client]
      KAFKA_SASL_USERNAME: watchdog
      KAFKA_SASL_PASSWORD: ${KAFKA_WATCHDOG_PASSWORD:?}
      WATCHDOG_INTERVAL_HOURS: ${WATCHDOG_INTERVAL_HOURS:?}
      WATCHDOG_GRACE_MINUTES: ${WATCHDOG_GRACE_MINUTES:?}
      WATCHDOG_DATASETS: ${WATCHDOG_DATASETS?}
      WATCHDOG_WEBHOOK_URL: ${WATCHDOG_WEBHOOK_URL?}
    volumes: ["./certs:/certs:ro"]
    ports: ["8446:8446"]
    mem_limit: 256m
    depends_on:
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      idp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8446/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Spark worker scaler: THE ONE SERVICE WITH THE DOCKER SOCKET ──────────
  # Root-equivalent on the host (D17, TRUST-BOUNDARY). It does nothing but
  # scale spark-worker between SPARK_WORKERS_MIN and _MAX on the master's load.
  scaler:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.ops}
    container_name: pl-scaler
    user: root
    command: uvicorn services.scaler.app:app --host 0.0.0.0 --port 8448
    environment:
      SPARK_MASTER_UI: http://spark-master:8080
      SPARK_WORKERS_MIN: ${SPARK_WORKERS_MIN:?}
      SPARK_WORKERS_MAX: ${SPARK_WORKERS_MAX:?}
      SCALER_ENABLED: ${SCALER_ENABLED:?}
      SCALER_POLL_SECONDS: ${SCALER_POLL_SECONDS:?}
      SCALER_COOLDOWN_SECONDS: ${SCALER_COOLDOWN_SECONDS:?}
      SCALER_UP_THRESHOLD: ${SCALER_UP_THRESHOLD:?}
      SCALER_DOWN_THRESHOLD: ${SCALER_DOWN_THRESHOLD:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8448:8448"]
    mem_limit: 256m
    depends_on:
      spark-master: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8448/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Console: upload, run, watch ──────────────────────────────────────────
  console:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.ops}
    container_name: pl-console
    command: uvicorn services.console.app:app --host 0.0.0.0 --port 8447
    environment:
      <<: [*tls, *postgres-client]
      CONSOLE_ADMIN_USER: ${CONSOLE_ADMIN_USER:?}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:?}
      CONSOLE_SESSION_SECONDS: ${CONSOLE_SESSION_SECONDS:?}
      # Dev auto-login (D23): a local browser gets a session without typing
      # the password; the console logs in to the IdP itself with this secret.
      # MUST be false anywhere the console is reachable from outside.
      CONSOLE_DEV_AUTOLOGIN: ${CONSOLE_DEV_AUTOLOGIN:?}
      CLIENT_SECRET_CONSOLE_ADMIN: ${CLIENT_SECRET_CONSOLE_ADMIN:?}
      WATCHDOG_URL: http://watchdog:8446
      UPLOAD_DIR: /data/incoming
      UPLOAD_MAX_ROWS: ${UPLOAD_MAX_ROWS:?}
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
      SCALER_URL: http://scaler:8448
      EXTRACT_MODE: ${EXTRACT_MODE:?}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID?}
      # The console is the front door: NOTHING is allowlisted, so browser
      # traffic is what the audit sees (D18).
      TRAFFIC_ALLOWLIST: ""
      TRAFFIC_BLOCK_SECONDS: ${TRAFFIC_BLOCK_SECONDS:?}
      WATCHDOG_WEBHOOK_URL: ${WATCHDOG_WEBHOOK_URL?}
    volumes:
      - ./data:/data:rw
      - ./certs:/certs:ro
      - ./config/traffic_profile.json:/opt/pipeline/config/traffic_profile.json:ro
    ports: ["8447:8447"]
    mem_limit: 512m
    depends_on:
      idp: {condition: service_healthy}
      postgres: {condition: service_healthy}
      watchdog: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8447/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Warehouse ────────────────────────────────────────────────────────────
  postgres:
    <<: *common
    profiles: [core]
    image: postgres:16-alpine
    container_name: pl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ["5433:5432"]
    mem_limit: 1g
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-warehouse.sql:/docker-entrypoint-initdb.d/10-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Hive metastore backing DB ────────────────────────────────────────────
  hive-metastore-db:
    <<: *common
    profiles: [core]
    image: postgres:16-alpine
    container_name: pl-hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_METASTORE_PASSWORD:?}
    mem_limit: 512m
    volumes: [hive_meta_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Hive metastore + HiveServer2 ─────────────────────────────────────────
  hive-metastore:
    <<: *common
    profiles: [core]
    image: apache/hive:4.0.0
    container_name: pl-hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_PASSWORD:?}
    ports: ["9083:9083"]
    mem_limit: 1200m
    depends_on:
      hive-metastore-db: {condition: service_healthy}
    volumes:
      - ./data/hive:/opt/hive/data/warehouse
      - ./docker/postgresql-jdbc.jar:/opt/hive/lib/postgresql.jar:ro
      # The external table LOCATION is an absolute /data/... path; Hive
      # resolves it inside ITS OWN container, so /data must exist here too.
      - ./data:/data:rw

  hiveserver2:
    <<: *common
    profiles: [core]
    image: apache/hive:4.0.0
    container_name: pl-hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://hive-metastore:9083
      IS_RESUME: "true"
    ports: ["10000:10000", "10002:10002"]
    mem_limit: 1500m
    depends_on: [hive-metastore]
    volumes:
      - ./data/hive:/opt/hive/data/warehouse
      - ./data:/data:rw

  # ── Spark ────────────────────────────────────────────────────────────────
  spark-master:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    container_name: pl-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      PYTHONPATH: /opt/pipeline
    ports: ["8080:8080", "7077:7077"]
    mem_limit: 1g
    volumes: [./:/opt/pipeline:rw]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The scaler clones THIS definition when it scales up: same image, command,
  # environment, binds and network. Executors call the crypto service
  # themselves (D16), which is why the spark-job secret and the CA are here.
  spark-worker:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1g
      PYTHONPATH: /opt/pipeline
      IDP_URL: https://idp:8443
      CRYPTO_URL: https://crypto:8444
      PIPELINE_CA_BUNDLE: /opt/pipeline/certs/ca.crt
      CLIENT_SECRET_SPARK_JOB: ${CLIENT_SECRET_SPARK_JOB:?}
      PIPELINE_BATCH_ROWS: ${PIPELINE_BATCH_ROWS:?}
    mem_limit: 1500m
    depends_on:
      spark-master: {condition: service_healthy}
    # Executors write the Parquet themselves, so /data must resolve to the
    # SAME path here as in the driver container.
    volumes:
      - ./:/opt/pipeline:rw
      - ./data:/data:rw
    deploy:
      replicas: ${SPARK_WORKERS_MIN:?}

  # ── Airflow (standalone: api-server + scheduler + triggerer + dag-processor)
  airflow:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.airflow}
    container_name: pl-airflow
    command: standalone
    environment:
      <<: [*tls, *kafka-client, *postgres-client]
      # Deliberately NOT setting AIRFLOW__API__BASE_URL to the host-mapped
      # localhost:8085: task subprocesses use it to phone home from inside
      # the container, where only 8080 exists.
      AIRFLOW__API__PORT: "8080"
      # A known admin password, written into the passwords file by
      # docker/airflow-entrypoint.sh so the console can trigger runs (D15).
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:?}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      # New DAGs start unpaused: the consumer DAG's asset watcher only runs
      # while its DAG is unpaused, and a paused listener hears no verdicts
      # (seen live, 2026-09-08).
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
      PIPELINE_DATA_ROOT: /data
      PIPELINE_BATCH_ROWS: ${PIPELINE_BATCH_ROWS:?}
      CRYPTO_URL: https://crypto:8444
      # Encrypt stage runs on the real Spark cluster. Unset this and
      # spark_encrypt falls back to pyarrow; the verdict then says so.
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: pl-airflow
      PYSPARK_PYTHON: /usr/bin/python3.12
      HIVE_JDBC_URL: jdbc:hive2://hiveserver2:10000
      # The publisher authenticates as `pipeline`: WRITE the topics, read none.
      KAFKA_SASL_USERNAME: pipeline
      KAFKA_SASL_PASSWORD: ${KAFKA_PIPELINE_PASSWORD:?}
      # The consumer DAG's trigger reads the control topic as `consumer`.
      AIRFLOW_CONN_KAFKA_CONTROL: '{"conn_type":"kafka","extra":{"bootstrap.servers":"${KAFKA_BOOTSTRAP:?}","group.id":"airflow-verdict-listener","security.protocol":"SASL_PLAINTEXT","sasl.mechanism":"PLAIN","sasl.username":"consumer","sasl.password":"${KAFKA_CONSUMER_PASSWORD:?}","auto.offset.reset":"latest","enable.auto.commit":"false"}}'
      CLIENT_SECRET_EXTRACT_JOB: ${CLIENT_SECRET_EXTRACT_JOB:?}
      CLIENT_SECRET_SPARK_JOB: ${CLIENT_SECRET_SPARK_JOB:?}
      CLIENT_SECRET_HIVE_JOB: ${CLIENT_SECRET_HIVE_JOB:?}
      CLIENT_SECRET_POSTGRES_JOB: ${CLIENT_SECRET_POSTGRES_JOB:?}
      CLIENT_SECRET_REPORT_JOB: ${CLIENT_SECRET_REPORT_JOB:?}
      CLIENT_SECRET_ORCHESTRATOR_JOB: ${CLIENT_SECRET_ORCHESTRATOR_JOB:?}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:?}
      # Empty: EXTRACT_MODE=auto falls through to the offline fixture.
      GCP_PROJECT_ID: ${GCP_PROJECT_ID?}
      EXTRACT_MODE: ${EXTRACT_MODE:?}
      BQ_DATASET: ${BQ_DATASET:?}
      BQ_TABLE: ${BQ_TABLE:?}
      BQ_DATASET_NAME: ${BQ_DATASET_NAME:?}
      BQ_SQL_FILE: ${BQ_SQL_FILE:?}
      BQ_DATA_START: ${BQ_DATA_START:?}
      BQ_DATA_END: ${BQ_DATA_END:?}
      BQ_WINDOW_HOURS: ${BQ_WINDOW_HOURS:?}
      BQ_ATTEMPTS: ${BQ_ATTEMPTS:?}
      CSV_FALLBACK_PATH: ${CSV_FALLBACK_PATH:?}
      BQ_MAX_BYTES_BILLED: ${BQ_MAX_BYTES_BILLED:?}
    ports: ["8085:8080"]
    mem_limit: 4g
    depends_on:
      idp: {condition: service_healthy}
      crypto: {condition: service_healthy}
      postgres: {condition: service_healthy}
      hive-metastore: {condition: service_started}
      kafka: {condition: service_healthy}
    volumes:
      - ./data:/data:rw
      - ./dags:/opt/pipeline/dags:ro
      - ./certs:/certs:ro
      - ./pipeline-reports:/opt/pipeline/pipeline-reports:rw
      - ./secrets:/secrets:ro
      # Mounted so a code, contract or policy change takes effect on the next
      # task run. config/ is writable: the pipeline GENERATES a Ranger policy
      # and a data contract for a dataset it has not seen before.
      - ./pipeline:/opt/pipeline/pipeline:ro
      - ./contracts:/opt/pipeline/contracts:ro
      - ./config:/opt/pipeline/config:rw
      - airflow_home:/opt/airflow
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Jenkins (opt in with --profile ci) ───────────────────────────────────
  jenkins:
    <<: *common
    profiles: [ci]
    build: {context: ., dockerfile: docker/Dockerfile.jenkins}
    container_name: pl-jenkins
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?}
    ports: ["8095:8080"]
    mem_limit: 1200m
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./docker/jenkins/casc.yaml:/var/jenkins_casc/casc.yaml:ro
      - ./:/opt/pipeline:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ── Apache Ranger (heavy; opt in with --profile ranger) ──────────────────
  ranger-db:
    <<: *common
    profiles: [ranger]
    image: postgres:16-alpine
    container_name: pl-ranger-db
    environment:
      POSTGRES_DB: ranger
      POSTGRES_USER: ranger
      POSTGRES_PASSWORD: ${RANGER_DB_PASSWORD:?}
    mem_limit: 512m
    volumes: [ranger_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranger -d ranger"]
      interval: 5s
      timeout: 3s
      retries: 20

  ranger-solr:
    <<: *common
    profiles: [ranger]
    image: solr:9
    container_name: pl-ranger-solr
    command: solr-precreate ranger_audits
    mem_limit: 1500m
    volumes: [ranger_solr_data:/var/solr]

  ranger-admin:
    <<: *common
    profiles: [ranger]
    image: apache/ranger:2.4.0
    container_name: pl-ranger-admin
    environment:
      RANGER_DB_TYPE: postgres
      RANGER_DB_HOST: ranger-db
      RANGER_DB_NAME: ranger
      RANGER_DB_USER: ranger
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD:?}
      RANGER_ADMIN_PASSWORD: ${RANGER_ADMIN_PASSWORD:?}
      RANGER_AUDIT_SOLR_URLS: http://ranger-solr:8983/solr/ranger_audits
    ports: ["6080:6080"]
    mem_limit: 3g
    depends_on:
      ranger-db: {condition: service_healthy}

networks:
  pipeline:
    name: pipeline-net

volumes:
  kafka_data:
  pg_data:
  hive_meta_data:
  ranger_db_data:
  ranger_solr_data:
  airflow_home:
  jenkins_home:

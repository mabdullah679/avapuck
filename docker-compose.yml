# Local stack for the BigQuery -> Spark -> Hive -> Postgres -> PDF pipeline.
#
# Sized for a 23GB Docker allocation. Profiles let you bring up only what you
# need: the `core` profile is enough to run the pipeline end to end; `ranger`
# adds the real Apache Ranger admin, which is heavy and slow to start.
#
#   docker compose --profile core up -d              # ~8GB, fast
#   docker compose --profile core --profile ranger up -d   # ~14GB, slow start

x-common: &common
  restart: unless-stopped
  networks: [pipeline]

services:

  # ── Identity Provider ────────────────────────────────────────────────────
  idp:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.service}
    container_name: pl-idp
    command: >
      uvicorn services.idp.app:app --host 0.0.0.0 --port 8443
      --ssl-certfile /certs/idp.crt --ssl-keyfile /certs/idp.key
    volumes: ["./certs:/certs:ro"]
    environment:
      IDP_ISSUER: https://idp:8443
      IDP_TOKEN_TTL: "300"
      CLIENT_SECRET_EXTRACT_JOB: ${CLIENT_SECRET_EXTRACT_JOB:-dev-extract-secret}
      CLIENT_SECRET_SPARK_JOB: ${CLIENT_SECRET_SPARK_JOB:-dev-spark-secret}
      CLIENT_SECRET_HIVE_JOB: ${CLIENT_SECRET_HIVE_JOB:-dev-hive-secret}
      CLIENT_SECRET_POSTGRES_JOB: ${CLIENT_SECRET_POSTGRES_JOB:-dev-postgres-secret}
      CLIENT_SECRET_REPORT_JOB: ${CLIENT_SECRET_REPORT_JOB:-dev-report-secret}
      IDP_SIGNING_KEY: ${IDP_SIGNING_KEY:-}
    ports: ["8443:8443"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://localhost:8443/health',context=ssl.create_default_context(cafile='/certs/ca.crt'))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Crypto service (AES-256-GCM) ─────────────────────────────────────────
  crypto:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.service}
    container_name: pl-crypto
    command: >
      uvicorn services.crypto.app:app --host 0.0.0.0 --port 8444
      --ssl-certfile /certs/crypto.crt --ssl-keyfile /certs/crypto.key
    volumes: ["./certs:/certs:ro"]
    environment:
      IDP_ISSUER: https://idp:8443
      IDP_JWKS_URL: https://idp:8443/.well-known/jwks.json
      PIPELINE_CA_BUNDLE: /certs/ca.crt
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-}
      CRYPTO_KEY_VERSION: v1
    ports: ["8444:8444"]
    mem_limit: 512m
    depends_on:
      idp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://localhost:8444/health',context=ssl.create_default_context(cafile='/certs/ca.crt'))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Kafka (KRaft — no ZooKeeper) ─────────────────────────────────────────
  kafka:
    <<: *common
    profiles: [core]
    image: apache/kafka:3.9.0
    container_name: pl-kafka
    environment:
      # Single-node KRaft: this broker is also the controller. Fine for a
      # local stack; a real deployment runs 3+ controllers and RF>=3.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # The CONTROLLER listener must NOT appear in advertised.listeners, and
      # this image derives one from the other unless both are given
      # explicitly -- otherwise it advertises 0.0.0.0 and refuses to start.
      # Client listeners require SASL/PLAIN; the controller listener stays
      # plain because it never leaves this node in a single-node KRaft setup.
      #
      # SASL_PLAINTEXT is AUTHENTICATION, not encryption: it proves who the
      # client is and the ACLs below decide what they may do, but the message
      # bytes still travel unencrypted. Sensitive fields on rpos_encrypted are
      # already AES ciphertext, so what a network observer would see there is
      # ciphertext either way. Wire encryption needs SASL_SSL and broker certs
      # -- see TRUST-BOUNDARY.md 2.9.
      KAFKA_LISTENERS: SASL_PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # Authorization. Without an authorizer, authentication alone would let
      # any authenticated client read or write any topic.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # ANONYMOUS is the controller listener's principal: that listener is
      # PLAINTEXT (it never leaves this node), so the broker registering
      # itself arrives unauthenticated and a deny-by-default authorizer
      # refuses it. Client listeners still require SASL, so this does not
      # make the broker open -- nothing external can reach CONTROLLER.
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
      # Deny by default: a principal with no matching ACL gets nothing.
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka-jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: pl-kafka-local-cluster
    ports: ["29092:29092"]
    mem_limit: 1500m
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./docker/kafka-jaas.conf:/etc/kafka/kafka-jaas.conf:ro
      - ./docker/kafka-admin.properties:/etc/kafka/admin.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /etc/kafka/admin.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Creates the two topics once, then exits. Topics are NOT auto-created:
  # a typo in a topic name should fail loudly, not silently make a new topic.
  kafka-init:
    <<: *common
    profiles: [core]
    image: apache/kafka:3.9.0
    container_name: pl-kafka-init
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      T_ENC: ${KAFKA_TOPIC_ENCRYPTED:-rpos_encrypted}
      T_PUB: ${KAFKA_TOPIC_PUBLIC:-rpos_flat}
    volumes:
      - ./docker/kafka-init.sh:/kafka-init.sh:ro
      - ./docker/kafka-admin.properties:/etc/kafka/admin.properties:ro
    entrypoint: ["/bin/sh", "/kafka-init.sh"]

  # ── Warehouse ────────────────────────────────────────────────────────────
  postgres:
    <<: *common
    profiles: [core]
    image: postgres:16-alpine
    container_name: pl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline-dev-password}
    ports: ["5433:5432"]
    mem_limit: 1g
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-warehouse.sql:/docker-entrypoint-initdb.d/10-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Hive metastore backing DB ────────────────────────────────────────────
  hive-metastore-db:
    <<: *common
    profiles: [core]
    image: postgres:16-alpine
    container_name: pl-hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_METASTORE_PASSWORD:-hive-dev-password}
    mem_limit: 512m
    volumes: [hive_meta_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Hive metastore + HiveServer2 ─────────────────────────────────────────
  hive-metastore:
    <<: *common
    profiles: [core]
    image: apache/hive:4.0.0
    container_name: pl-hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_PASSWORD:-hive-dev-password}
    ports: ["9083:9083"]
    mem_limit: 1200m
    depends_on:
      hive-metastore-db: {condition: service_healthy}
    volumes:
      - ./data/hive:/opt/hive/data/warehouse
      - ./docker/postgresql-jdbc.jar:/opt/hive/lib/postgresql.jar:ro
      # The external table LOCATION is an absolute /data/... path written by
      # the mask stage, and Hive resolves it inside ITS OWN container -- so
      # /data must exist here too, at the same path, or the DDL fails with
      # "not a directory or unable to create one".
      - ./data:/data:rw

  hiveserver2:
    <<: *common
    profiles: [core]
    image: apache/hive:4.0.0
    container_name: pl-hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://hive-metastore:9083
      IS_RESUME: "true"
    ports: ["10000:10000", "10002:10002"]
    mem_limit: 1500m
    depends_on: [hive-metastore]
    volumes:
      - ./data/hive:/opt/hive/data/warehouse
      # The external table LOCATION is an absolute /data/... path written by
      # the mask stage, and Hive resolves it inside ITS OWN container -- so
      # /data must exist here too, at the same path, or the DDL fails with
      # "not a directory or unable to create one".
      - ./data:/data:rw

  # ── Spark ────────────────────────────────────────────────────────────────
  spark-master:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    container_name: pl-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      PYTHONPATH: /opt/pipeline
    ports: ["8080:8080", "7077:7077"]
    mem_limit: 1g
    volumes: [./:/opt/pipeline:rw]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-worker:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1g
      PYTHONPATH: /opt/pipeline
      IDP_URL: https://idp:8443
      CRYPTO_URL: https://crypto:8444
      PIPELINE_CA_BUNDLE: /opt/pipeline/certs/ca.crt
      CLIENT_SECRET_SPARK_JOB: ${CLIENT_SECRET_SPARK_JOB:-dev-spark-secret}
    mem_limit: 1500m
    depends_on:
      spark-master: {condition: service_healthy}
    # Executors write the Parquet themselves, so /data must resolve to the
    # SAME path here as in the driver container -- Spark passes an absolute
    # output path across, not a relative one. Without this the tasks fail with
    # "Mkdirs failed to create file:/data/..." and the stage silently falls
    # back to pyarrow.
    volumes:
      - ./:/opt/pipeline:rw
      - ./data:/data:rw
    deploy:
      replicas: 2

  # ── Airflow (standalone: api-server + scheduler + triggerer + dag-processor)
  airflow:
    <<: *common
    profiles: [core]
    build: {context: ., dockerfile: docker/Dockerfile.airflow}
    container_name: pl-airflow
    command: standalone
    environment:
      # Deliberately NOT setting AIRFLOW__API__BASE_URL to the host-mapped
      # localhost:8085: task subprocesses inherit that as
      # execution_api_server_url (base_url + /execution/) and use it to phone
      # home from inside the container, where 8085 doesn't exist -- only the
      # container's own 8080 does. Leaving base_url unset keeps the internal
      # default (http://localhost:8080), which is correct for both the task
      # subprocess and the in-container healthcheck; 8085 is purely the
      # host-side port mapping for browser access.
      AIRFLOW__API__PORT: "8080"
      PIPELINE_DATA_ROOT: /data
      IDP_URL: https://idp:8443
      CRYPTO_URL: https://crypto:8444
      # Encrypt stage runs on the real Spark cluster. Unset this and
      # spark_encrypt falls back to pyarrow -- correct output either way, but
      # the trace then reports engine=pyarrow, which is the honest signal that
      # Spark did not run.
      SPARK_MASTER_URL: spark://spark-master:7077
      # The driver runs in THIS container and the executors run in the worker
      # containers, so the workers must be able to reach back to the driver by
      # a resolvable name. Without this Spark advertises the container's
      # hostname, which the workers cannot resolve, and every task times out.
      SPARK_DRIVER_HOST: pl-airflow
      # The executor interpreter is selected by the driver and shipped to the
      # workers; the Spark image's own ENV does not decide it. Must match this
      # container's Python minor version or PySpark refuses to run.
      PYSPARK_PYTHON: /usr/bin/python3.12
      # Hive registration over JDBC, replacing the old `docker exec` path.
      HIVE_JDBC_URL: jdbc:hive2://hiveserver2:10000
      # Kafka. Two topics, one publisher: the encrypted sensitive fields go to
      # one, the non-sensitive business columns to the other. NOTHING sensitive
      # is ever published in the clear -- see TRUST-BOUNDARY.md 2.9.
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_TOPIC_ENCRYPTED: ${KAFKA_TOPIC_ENCRYPTED:-rpos_encrypted}
      KAFKA_TOPIC_PUBLIC: ${KAFKA_TOPIC_PUBLIC:-rpos_flat}
      # The publisher authenticates as `pipeline`, which ACLs allow to WRITE
      # both topics and to read neither -- a compromised publisher cannot
      # drain the topics it feeds.
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-pipeline}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-pipeline-dev-password}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      # Every pipeline client verifies the service certs against this CA.
      # Unset it and the clients fall back to the system trust store, which
      # does NOT contain the dev CA -- calls then fail closed, by design.
      PIPELINE_CA_BUNDLE: /certs/ca.crt
      # postgres_load defaults to localhost:5433, which is the HOST-side port
      # mapping. From inside this container the warehouse is postgres:5432 on
      # the compose network; without these the load stage hangs in connect
      # rather than failing, because there is nothing on localhost:5433 here.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline-dev-password}
      CLIENT_SECRET_EXTRACT_JOB: ${CLIENT_SECRET_EXTRACT_JOB:-dev-extract-secret}
      CLIENT_SECRET_SPARK_JOB: ${CLIENT_SECRET_SPARK_JOB:-dev-spark-secret}
      CLIENT_SECRET_HIVE_JOB: ${CLIENT_SECRET_HIVE_JOB:-dev-hive-secret}
      CLIENT_SECRET_POSTGRES_JOB: ${CLIENT_SECRET_POSTGRES_JOB:-dev-postgres-secret}
      CLIENT_SECRET_REPORT_JOB: ${CLIENT_SECRET_REPORT_JOB:-dev-report-secret}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      # NO default project: a fresh clone must not inherit whoever built
      # this. Unset, EXTRACT_MODE=auto falls through to the offline fixture
      # instead of failing against someone else's GCP project.
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # Retail point-of-sale transactions joined to customer records: real
      # PII (names, emails, street addresses) is the point -- it is what the
      # encrypt and mask stages exist to protect. ~24 MB scanned per run,
      # well under BQ_MAX_BYTES_BILLED. `auto` uses BigQuery only when
      # GCP_PROJECT_ID is set, and the offline fixture otherwise -- so a clone
      # with no credentials runs end to end rather than erroring.
      EXTRACT_MODE: ${EXTRACT_MODE:-auto}
      BQ_DATASET: ${BQ_DATASET:-bigquery-public-data.thelook_ecommerce}
      BQ_TABLE: ${BQ_TABLE:-order_items}
      BQ_DATASET_NAME: ${BQ_DATASET_NAME:-rpos_transactions}
      BQ_SQL_FILE: ${BQ_SQL_FILE:-/opt/pipeline/config/bq/rpos_transactions_cards.sql}
      # The 4-hour window maps into this range. Deliberately NOT the table's
      # full span: thelook_ecommerce has ~1-2 orders/day in 2019 versus ~100+
      # in 2025, so a 4-hour slice of the early data is almost always empty
      # and the extract fails closed. This window is dense enough that any
      # slot yields a full 100 rows, and reading recent transactions is what a
      # POS pipeline would actually do.
      BQ_DATA_START: ${BQ_DATA_START:-2025-01-01}
      BQ_DATA_END: ${BQ_DATA_END:-2026-08-31}
      # A 4-hour slice of ~100 orders/day yields ~15-20 rows, not 100. 24h
      # fills the 100-row cap on most slots. The cap still binds in the SQL --
      # this widens the window, it does not raise the limit.
      BQ_WINDOW_HOURS: ${BQ_WINDOW_HOURS:-24}
      # If BigQuery fails BQ_ATTEMPTS times in a row, the extract stage falls
      # back to this CSV rather than failing the run. Distinct from
      # CSV_SOURCE_PATH, which would bypass BigQuery entirely.
      BQ_ATTEMPTS: ${BQ_ATTEMPTS:-3}
      CSV_FALLBACK_PATH: ${CSV_FALLBACK_PATH:-/data/csv/BLM_CO_Q2_2026_Oil_and_Gas_Lease_Sale_-2400573660170243848.csv}
      BQ_MAX_BYTES_BILLED: ${BQ_MAX_BYTES_BILLED:-314572800}
    ports: ["8085:8080"]
    mem_limit: 3g
    depends_on:
      idp: {condition: service_healthy}
      crypto: {condition: service_healthy}
      postgres: {condition: service_healthy}
      hive-metastore: {condition: service_started}
      kafka: {condition: service_healthy}
    volumes:
      - ./data:/data:rw
      - ./dags:/opt/pipeline/dags:ro
      - ./certs:/certs:ro
      # Finished PDFs are filed here by the report stage. Separate from
      # ./data so the deliverables are not mixed in with pipeline scratch.
      - ./pipeline-reports:/opt/pipeline/pipeline-reports:rw
      # GCP service account key. Read-only, and secrets/ is gitignored --
      # this is a live credential that bills a real project.
      - ./secrets:/secrets:ro
      # pipeline/ and config/ are mounted rather than only baked into the
      # image so a code or policy change takes effect on the next task run
      # instead of needing a rebuild. config/ is writable because the mask
      # stage GENERATES a Ranger policy for a dataset it has not seen before,
      # and that file has to land in the repo where a human can review it.
      - ./pipeline:/opt/pipeline/pipeline:ro
      - ./config:/opt/pipeline/config:rw
      - airflow_home:/opt/airflow
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Apache Ranger (heavy; opt in with --profile ranger) ──────────────────
  ranger-db:
    <<: *common
    profiles: [ranger]
    image: postgres:16-alpine
    container_name: pl-ranger-db
    environment:
      POSTGRES_DB: ranger
      POSTGRES_USER: ranger
      POSTGRES_PASSWORD: ${RANGER_DB_PASSWORD:-ranger-dev-password}
    mem_limit: 512m
    volumes: [ranger_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranger -d ranger"]
      interval: 5s
      timeout: 3s
      retries: 20

  ranger-solr:
    <<: *common
    profiles: [ranger]
    image: solr:9
    container_name: pl-ranger-solr
    command: solr-precreate ranger_audits
    mem_limit: 1500m
    volumes: [ranger_solr_data:/var/solr]

  ranger-admin:
    <<: *common
    profiles: [ranger]
    image: apache/ranger:2.4.0
    container_name: pl-ranger-admin
    environment:
      RANGER_DB_TYPE: postgres
      RANGER_DB_HOST: ranger-db
      RANGER_DB_NAME: ranger
      RANGER_DB_USER: ranger
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD:-ranger-dev-password}
      RANGER_ADMIN_PASSWORD: ${RANGER_ADMIN_PASSWORD:-rangerR0cks!}
      RANGER_AUDIT_SOLR_URLS: http://ranger-solr:8983/solr/ranger_audits
    ports: ["6080:6080"]
    mem_limit: 3g
    depends_on:
      ranger-db: {condition: service_healthy}

networks:
  pipeline:
    name: pipeline-net

volumes:
  kafka_data:
  pg_data:
  hive_meta_data:
  ranger_db_data:
  ranger_solr_data:
  airflow_home:
